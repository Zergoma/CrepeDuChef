name: CI - Tests Only

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300-preview.0.26177.108'
          include-prerelease: true

      - name: Restore tests project
        run: dotnet restore CrepeDuChef.Tests/CrepeDuChef.Tests.csproj

      - name: Build tests project
        run: dotnet build CrepeDuChef.Tests/CrepeDuChef.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CrepeDuChef.Tests/CrepeDuChef.Tests.csproj --configuration Release --no-build
